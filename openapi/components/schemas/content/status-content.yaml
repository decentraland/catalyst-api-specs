required:
  - version
  - synchronizationStatus
  - commitHash
  - ethNetwork
type: object
properties:
  version:
    type: string
  commitHash:
    type: string
  ethNetwork:
    type: string
  synchronizationStatus:
    required:
      - lastSyncWithDAO
      - synchronizationState
    type: object
    properties:
      lastSyncWithDAO:
        type: number
        description: Timestamp of the last time the list of servers was refreshed from the DAO (0 if it hasn't happened yet)
      synchronizationState:
        type: string
        example: Syncing
        description: >-
          `Bootstrapping` while the server is catching up with the rest of the network, during which
          it rejects new deployments; `Syncing` afterwards
