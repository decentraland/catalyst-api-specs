type: object
additionalProperties: false
required:
  - authChain
properties:
  timestamp:
    type: string
    description: Legacy alternative to `signedMessage`, used only when `signedMessage` is absent
  signedMessage:
    type: string
  authChain:
    type: array
    minItems: 1
    maxItems: 10
    items:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - SIGNER
            - ECDSA_EPHEMERAL
            - ECDSA_SIGNED_ENTITY
            - ECDSA_EIP_1654_EPHEMERAL
            - ECDSA_EIP_1654_SIGNED_ENTITY
        payload:
          type: string
        signature:
          type: string
          nullable: true
          description: Required for every link except `SIGNER`, which takes an empty string or null
