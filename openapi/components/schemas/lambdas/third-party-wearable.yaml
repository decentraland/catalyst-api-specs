type: object
required:
  - urn
  - amount
  - individualData
  - name
  - category
  - entity
properties:
  urn:
    type: string
  amount:
    type: number
  individualData:
    type: array
    items:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        tokenId:
          type: string
  name:
    type: string
  category:
    type: string
  entity:
    $ref: ../content/entity.yaml
  definition:
    description: Present only when `includeDefinitions` is set
    $ref: ./wearable-definition.yaml
