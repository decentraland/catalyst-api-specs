type: object
required:
  - id
  - description
  - language
  - attributes
properties:
  id:
    type: string
    description: URN of the item
  name:
    type: string
  description:
    type: string
  language:
    type: string
  image:
    type: string
    description: URL of the item image, if it has one
  thumbnail:
    type: string
    description: URL of the item thumbnail, if it has one
  attributes:
    type: array
    items:
      type: object
      properties:
        trait_type:
          type: string
        value:
          type: string
