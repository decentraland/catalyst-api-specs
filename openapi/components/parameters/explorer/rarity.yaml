name: rarity
in: query
required: false
description: >-
  Only return elements of this rarity (case-insensitive). Elements without rarity are excluded. Any other
  value is rejected with a 400.
schema:
  type: string
  enum:
    - common
    - uncommon
    - rare
    - epic
    - legendary
    - exotic
    - mythic
    - unique
