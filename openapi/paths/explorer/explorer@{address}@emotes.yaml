get:
  operationId: getExplorerEmotes
  summary: Explorer emotes
  tags:
    - Explorer
  description: >-
    Get a paginated list of the on-chain emotes owned by the given address, grouped by URN, then filtered, sorted
    and paginated.
  parameters:
    - $ref: ../../components/parameters/explorer/address.yaml
    - name: collectionType
      in: query
      required: false
      description: >-
        Only return emotes of the given collection type. `on-chain` is the only type. Any other value is rejected
        with a 400.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - on-chain
    - $ref: ../../components/parameters/explorer/category.yaml
    - $ref: ../../components/parameters/explorer/name.yaml
    - $ref: ../../components/parameters/explorer/rarity.yaml
    - $ref: ../../components/parameters/explorer/order-by.yaml
    - $ref: ../../components/parameters/explorer/direction.yaml
    - $ref: ../../components/parameters/explorer/page-num.yaml
    - $ref: ../../components/parameters/explorer/page-size.yaml
    - $ref: ../../components/parameters/explorer/trimmed.yaml
    - $ref: ../../components/parameters/explorer/include-amount.yaml
  responses:
    '200':
      description: Emotes owned by the given address.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/explorer/emotes-explorer.yaml
          examples:
            default:
              $ref: ../../components/examples/explorer/200-emotes-explorer.json
            trimmed:
              $ref: ../../components/examples/explorer/200-emotes-explorer-trimmed.json
    '400':
      description: Invalid `collectionType`, `rarity`, `orderBy` or `direction`, or `pageSize` above 1000.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          example:
            error: Bad request
            message: max allowed pageSize is 1000
    '502':
      description: The owned emotes could not be fetched from their sources.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
    '503':
      description: The service is overloaded. Retry shortly.
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
