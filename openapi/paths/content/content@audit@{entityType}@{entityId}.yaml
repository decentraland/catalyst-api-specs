get:
  operationId: getEntityAuditInformation
  summary: Get information about an entity
  tags:
    - Content Server
  parameters:
    - in: path
      name: entityType
      required: true
      schema:
        type: string
        enum:
          - 'profile'
          - 'scene'
          - 'wearable'
          - 'emote'
          - 'store'
          - 'outfits'
        example: profile
      description: Type of the entity to audit.
    - in: path
      name: entityId
      required: true
      schema:
        type: string
        example: QmQgezF4UWTZpD5VqKs2AGCzucRJdm8zU87MxdSRH9heZR
      description: id of the entity
  description: >-
    Get the audit information (entity version, deployment local timestamp and auth chain) of the
    deployment of the entity with the specified type and id. Entities that are no longer active and
    denylisted entities are included.
  security: []
  responses:
    '200':
      description: Entity version, deployment local timestamp and auth chain
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/content/audit-response.yaml
          examples:
            default:
              $ref: ../../components/examples/content/200-audit-response.json
    '400':
      description: Unrecognized Entity type
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/content/error.yaml
          example:
            error: 'Unrecognized type: Houses'
    '404':
      description: No deployment found for the entity type and id
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/content/error.yaml
          example:
            error: No deployment found
