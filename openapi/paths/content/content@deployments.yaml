get:
  operationId: getDeployments
  summary: List of deployments
  deprecated: true
  tags:
    - Content Server
  description: >-
    Paginated history of the deployments stored in the server, most recent first by default. Use the
    `next` field of the pagination to fetch the following page. This endpoint is deprecated and
    heavily rate limited; use `/content/pointer-changes`, `/content/snapshots` or
    `/content/entities/active` instead.
  parameters:
    - in: query
      name: from
      schema:
        type: integer
        example: 1606829553969
      description: >-
        Minimum timestamp (in milliseconds) of the deployments to return. It applies to the field
        set in `sortingField`, local timestamp by default.
    - in: query
      name: to
      schema:
        type: integer
        example: 1606829553969
      description: >-
        Maximum timestamp (in milliseconds) of the deployments to return. It applies to the field
        set in `sortingField`, local timestamp by default.
    - in: query
      name: entityType
      schema:
        type: array
        maxItems: 1000
        items:
          type: string
          enum:
            - scene
            - profile
            - wearable
            - emote
            - store
            - outfits
      description: Type of the entities to return. Repeat the parameter to filter by several types.
    - in: query
      name: entityId
      schema:
        type: array
        maxItems: 1000
        items:
          type: string
      description: Id of the entities to return. Repeat the parameter to filter by several ids.
    - in: query
      name: pointer
      schema:
        type: array
        maxItems: 1000
        items:
          type: string
          example: '0,0'
      description: >-
        Return deployments affecting any of these pointers. Repeat the parameter to filter by several
        pointers.
    - in: query
      name: onlyCurrentlyPointed
      schema:
        type: boolean
      description: When `true`, only active deployments (not overwritten by a newer one) are returned
    - in: query
      name: fields
      schema:
        type: string
        example: pointers,content,metadata,auditInfo
      description: >-
        Comma separated list of the optional fields to include in each deployment, among `pointers`,
        `content`, `metadata` and `auditInfo`. Defaults to `pointers,content,metadata`.
    - in: query
      name: sortingField
      schema:
        type: string
        enum:
          - local_timestamp
          - entity_timestamp
        default: local_timestamp
      description: Field used to order the deployments.
    - in: query
      name: sortingOrder
      schema:
        type: string
        enum:
          - ASC
          - DESC
        default: DESC
      description: Order of the deployments
    - in: query
      name: lastId
      schema:
        type: string
      description: Id of the last entity of the previous page, used together with `from` or `to` to paginate
    - in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        maximum: 5000
        default: 0
      description: >-
        Number of deployments to skip. It can't be higher than 5000; use the `next` field of the
        pagination to go further.
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 500
      description: Page size. Values out of range fall back to 500.
  responses:
    '200':
      description: A page of deployments
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/content/deployments.yaml
          examples:
            default:
              $ref: ../../components/examples/content/200-deployments.json
    '400':
      description: Bad Request
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/content/error.yaml
          examples:
            entityType:
              summary: EntityType not recognized
              value:
                error: Found an unrecognized entity type
            offset:
              summary: Wrong offset value
              value:
                error: Offset can't be higher than 5000. Please use the 'next' property for pagination.
            tooManyFilters:
              summary: Too many filter values
              value:
                error: Too many filter values; the maximum allowed per filter is 1000
            sortingField:
              summary: Sorting field not recognized
              value:
                error: Found an unrecognized sort field param
    '429':
      description: Too many requests to this endpoint
