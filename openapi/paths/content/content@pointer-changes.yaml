get:
  operationId: getPointerChanges
  summary: List of changes made to a pointer
  tags:
    - Content Server
  description: >-
    Paginated list of the deployments that changed the entity a pointer resolves to, most recent
    first by default. Use the `next` field of the pagination to fetch the following page.
  parameters:
    - in: query
      name: from
      allowEmptyValue: true
      schema:
        type: integer
        example: 1606829553969
      description: >-
        Minimum timestamp (in milliseconds) of the deployments to return. It applies to the field
        set in `sortingField`, local timestamp by default.
    - in: query
      name: to
      allowEmptyValue: true
      schema:
        type: integer
        example: 1606829553969
      description: >-
        Maximum timestamp (in milliseconds) of the deployments to return. It applies to the field
        set in `sortingField`, local timestamp by default.
    - in: query
      name: lastId
      allowEmptyValue: true
      schema:
        type: string
        example: QmNknKv8MuKbfZ73z4QdUEsNbTd1ZAN1fSuwTFGiNGeCt5
      description: >-
        It is the last entity id that was visited, so it will be skipped when
        showing current page.
    - in: query
      name: offset
      allowEmptyValue: true
      schema:
        type: integer
        minimum: 0
        maximum: 5000
        default: 0
      description: >-
        Number of deployments to skip. It can't be higher than 5000; use the `next` field of the
        pagination to go further.
    - in: query
      name: limit
      allowEmptyValue: true
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 500
        example: 100
      description: >-
        The deployments are a paginated collection, this parameter corresponds
        to the limit for each page. Values out of range fall back to 500.
    - in: query
      name: entityType
      allowEmptyValue: true
      schema:
        type: array
        items:
          type: string
          enum:
            - scene
            - profile
            - wearable
            - emote
            - store
            - outfits
          example: profile
      description: >-
        The type of entities that will be shown in the collection. Repeat the parameter to filter by
        several types.
    - in: query
      name: sortingField
      schema:
        type: string
        enum:
          - local_timestamp
          - entity_timestamp
        example: local_timestamp
      description: >-
        This value is used as the field to order all the deployments in the
        collection. If no parameter is sent, then the default field to order
        with will be local_timestamp.
    - in: query
      name: sortingOrder
      schema:
        type: string
        enum:
          - ASC
          - DESC
        example: ASC
      description: >-
        This value is used as the order for all the deployments in the
        collection. If no parameter is sent, then the default field to order
        with will be DESC.
  responses:
    '200':
      description: List of deployment changes made to pointers
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/content/pointer-changes.yaml
          examples:
            default:
              $ref: ../../components/examples/content/200-pointer-changes.json
    '400':
      description: Bad Request
      content:
        application/json; charset=utf-8:
          schema:
            $ref: ../../components/schemas/content/error.yaml
          examples:
            entityType:
              summary: EntityType not recognized
              value:
                error: Found an unrecognized entity type
            offset:
              summary: Wrong offset value
              value:
                error: >-
                  Offset can't be higher than 5000. Please use the 'next' property
                  for pagination.
            sortingField:
              summary: Sorting field not recognized
              value:
                error: Found an unrecognized sort field param
            sortingOrder:
              summary: Sorting order not recognized
              value:
                error: Found an unrecognized sort order param
