get:
  operationId: getThirdPartyCollection
  summary: Returns the list of third party wearables for the given collection
  tags:
    - Lambdas
  description: >-
    Returns a paginated list of the third party (linked) wearables of the given collection
    owned by the provided address
  parameters:
    - in: path
      name: address
      required: true
      schema:
        type: string
        example: '0xf4f7512c68f358856514cd4e449fc6c5ac04bb15'
      description: >-
        Ethereum address from which you want to get the list of wearables
    - in: path
      name: collectionId
      required: true
      schema:
        type: string
        example: 'urn:decentraland:matic:collections-thirdparty:ntr1-meta:ntr1-meta-1ef79e7b'
      description: >-
        Third party collection URN. Only the third party part of the URN (the first five segments) is used,
        so every collection of that third party is matched.
    - in: query
      name: includeDefinitions
      allowEmptyValue: true
      schema:
        type: boolean
        example: true
      description: >-
        If present (any value), each element is extended with its wearable definition.
    - in: query
      name: pageNum
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
      description: >-
        The number of the requested page.
    - in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        default: 100
        example: 10
      description: >-
        The size of the requested page.
  responses:
    '200':
      description: Returns the list of third party wearables
      content:
        application/json:
          schema:
            type: object
            required:
              - elements
              - totalAmount
              - pageNum
              - pageSize
            properties:
              elements:
                type: array
                items:
                  $ref: ../../components/schemas/lambdas/third-party-wearable.yaml
              totalAmount:
                type: number
              pageNum:
                type: number
              pageSize:
                type: number
    '400':
      description: The collection id is not a third party collection URN
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            default:
              value:
                error: Bad request
                message: 'Invalid collection id: invalid-urn not a valid URN'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
    '502':
      description: The wearables could not be fetched from the upstream sources
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
