get:
  operationId: getLands
  summary: Get list of lands for an address
  tags:
    - Lambdas
  description: Get a paginated list of the parcels and estates owned by the given address
  parameters:
    - in: path
      name: address
      required: true
      schema:
        type: string
        example: '0xddf1eec586d8f8f0eb8c5a3bf51fb99379a55684'
      description: >-
        Ethereum address from which you want to get the list of lands
    - in: query
      name: pageNum
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
      description: >-
        The number of the requested page.
    - in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        default: 100
        example: 10
      description: >-
        The size of the requested page.
  responses:
    '200':
      description: List of lands owned by the given address
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lands-paginated.yaml
          examples:
            default:
              $ref: ../../components/examples/lambdas/200-lands-paginated.json
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
    '502':
      description: The lands could not be fetched and there is no cached result for the address
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
