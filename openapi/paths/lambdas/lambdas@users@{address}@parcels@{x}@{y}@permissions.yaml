get:
  operationId: getParcelPermissions
  summary: Get the permissions for a parcel
  tags:
    - Lambdas
  description: >-
    Get the permissions an address has over a parcel, using the same rights resolution as
    `/lambdas/parcels/{x}/{y}/operators`
  parameters:
    - in: path
      name: address
      required: true
      schema:
        type: string
        example: '0xddf1eec586d8f8f0eb8c5a3bf51fb99379a55684'
      description: >-
        Ethereum address from which you want to get the permissions
    - in: path
      name: x
      required: true
      schema:
        type: integer
        example: 100
      description: >-
        X coordinate of the parcel
    - in: path
      name: y
      required: true
      schema:
        type: integer
        example: 100
      description: >-
        Y coordinate of the parcel
  responses:
    '200':
      description: Permissions the address has over the parcel
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/parcel-permissions.yaml
          examples:
            default:
              $ref: ../../components/examples/lambdas/200-parcel-permissions.json
    '400':
      description: The coordinates or the address are invalid
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            invalid-coordinates:
              summary: Invalid coordinate format or range
              value:
                error: Bad request
                message: Coordinates X and Y must be valid numbers in a valid range
            invalid-address:
              summary: Invalid Ethereum address format
              value:
                error: Bad request
                message: Address must be a valid Ethereum address
    '404':
      description: No parcel or estate was found for the coordinates
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            not-found:
              summary: Parcel not found
              value:
                error: Bad Request
                message: 'Parcel or estate rights not found for x: 100, y: 100'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
