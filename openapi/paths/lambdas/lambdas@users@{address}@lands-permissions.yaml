get:
  operationId: getLandsPermissions
  summary: Get the parcels an address can operate
  tags:
    - Lambdas
  description: >-
    Get a paginated list of the parcels for which the given address is the update operator.
    Operators, update managers and approvals for all are not included.
  parameters:
    - in: path
      name: address
      required: true
      schema:
        type: string
        example: '0xddf1eec586d8f8f0eb8c5a3bf51fb99379a55684'
      description: >-
        Ethereum address from which you want to get the parcels
    - in: query
      name: pageNum
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
      description: >-
        The number of the requested page.
    - in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        default: 100
        example: 10
      description: >-
        The size of the requested page.
  responses:
    '200':
      description: List of parcels the given address is update operator of
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lands-permissions-paginated.yaml
          examples:
            default:
              $ref: ../../components/examples/lambdas/200-lands-permissions-paginated.json
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
    '502':
      description: The parcels could not be fetched from the upstream sources
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
