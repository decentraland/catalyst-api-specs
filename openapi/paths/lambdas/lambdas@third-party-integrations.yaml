get:
  operationId: getThirdPartyIntegrations
  summary: Returns the list of third party integrations as well as collections
  tags:
    - Lambdas
  description: Returns the list of third party integrations and collections
  responses:
    '200':
      description: Returns the list of third party integrations and collections
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/third-party-integrations.yaml
          examples:
            default:
              $ref: ../../components/examples/lambdas/200-third-party-integrations.json
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
    '502':
      description: The third party providers could not be fetched
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
