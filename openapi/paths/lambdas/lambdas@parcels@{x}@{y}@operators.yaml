get:
  operationId: getParcelOperators
  summary: Get the operators for a parcel
  tags:
    - Lambdas
  description: >-
    Get the owner of a parcel and the addresses allowed to operate it. When the parcel belongs to an estate,
    the owner, operator and update managers are those of the estate, and a parcel-level update operator
    takes precedence over the estate one.
  parameters:
    - in: path
      name: x
      required: true
      schema:
        type: integer
        example: 100
      description: >-
        X coordinate of the parcel
    - in: path
      name: y
      required: true
      schema:
        type: integer
        example: 100
      description: >-
        Y coordinate of the parcel
  responses:
    '200':
      description: Owner and operators of the parcel
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/parcel-operators.yaml
          examples:
            default:
              $ref: ../../components/examples/lambdas/200-parcel-operators.json
    '400':
      description: The coordinates are not numbers or are outside the map
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            invalid-coordinates:
              summary: Invalid coordinate format or range
              value:
                error: Bad request
                message: Coordinates X and Y must be valid numbers in a valid range
    '404':
      description: No parcel or estate was found for the coordinates
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            not-found:
              summary: Parcel not found
              value:
                error: Bad Request
                message: 'Parcel or estate rights not found for x: 100, y: 100'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
