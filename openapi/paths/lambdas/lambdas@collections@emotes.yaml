get:
  deprecated: true
  operationId: searchEmotes
  summary: Search Emotes
  tags:
    - Lambdas
  description: >-
    Search the on-chain emotes catalog and retrieve their definitions. Base emotes are not included. At least
    one of `textSearch`, `collectionId` or `emoteId` is required. Results are sorted by URN and paginated with
    the `lastId` cursor.
  parameters:
    - in: query
      name: collectionId
      schema:
        type: array
        items:
          type: string
        example:
          - urn:decentraland:matic:collections-v2:0x02747d94478632a65dc51a9d34186a4eb95a24a6
      style: form
      explode: true
      description: Collection URN to search in. Can be repeated up to 500 times.
    - in: query
      name: emoteId
      schema:
        type: array
        items:
          type: string
        example:
          - urn:decentraland:matic:collections-v2:0x02747d94478632a65dc51a9d34186a4eb95a24a6:0
      style: form
      explode: true
      description: Emote URN to retrieve. Can be repeated up to 500 times.
    - in: query
      name: textSearch
      schema:
        type: string
        minLength: 3
        example: dance
      description: Text to search for in the emotes. Case-insensitive, at least 3 characters.
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 500
        example: 2
      description: >-
        Maximum number of emotes to return. Values that are not a number between 1 and 500 fall back to 500.
    - in: query
      name: lastId
      schema:
        type: string
        example: urn:decentraland:matic:collections-v2:0x02747d94478632a65dc51a9d34186a4eb95a24a6:0
      description: >-
        URN of the last emote of the previous page. Only emotes with a greater URN are returned.
  responses:
    '200':
      description: Emotes matching the filters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/emotes.yaml
          examples:
            default:
              $ref: ../../components/examples/lambdas/200-emotes.json
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            MissingFilter:
              summary: Missing Filter
              value:
                error: Bad request
                message: "You must use one of the filters: 'textSearch', 'collectionId' or 'emoteId'"
            TextSearch:
              summary: Bad search text
              value:
                error: Bad request
                message: The text search must be at least 3 characters long
            Ids:
              summary: Too many emote ids
              value:
                error: Bad request
                message: You can't ask for more than 500 emotes
            Collection:
              summary: Too many collection ids
              value:
                error: Bad request
                message: You can't filter for more than 500 collection ids
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
