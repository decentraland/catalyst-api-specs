get:
  operationId: getWearables
  summary: Get list of wearables for an address
  tags:
    - Lambdas
  description: >-
    Get a paginated list of the on-chain wearables owned by the given address, grouped by item.
    Base and third-party wearables are not included.
  parameters:
    - in: path
      name: address
      required: true
      schema:
        type: string
        example: '0xa87d168717538e86d71ac48baccaeb84162de602'
      description: >-
        Ethereum address from which you want to get the list of wearables
    - in: query
      name: includeEntities
      allowEmptyValue: true
      schema:
        type: boolean
        example: true
      description: >-
        If present (any value), each element is extended with its content server entity.
        Cannot be combined with `includeDefinitions`.
    - in: query
      name: includeDefinitions
      allowEmptyValue: true
      schema:
        type: boolean
        example: true
      description: >-
        If present (any value), each element is extended with its wearable definition.
        Cannot be combined with `includeEntities`.
    - in: query
      name: category
      schema:
        type: string
        example: upper_body
      description: Only return wearables of this category. Case-insensitive.
    - in: query
      name: rarity
      schema:
        type: string
        example: legendary
      description: Only return wearables of this rarity. Case-insensitive.
    - in: query
      name: name
      schema:
        type: string
        example: hoodie
      description: Only return wearables whose name contains this text. Case-insensitive.
    - in: query
      name: orderBy
      schema:
        type: string
        enum:
          - rarity
          - name
          - date
        example: rarity
      description: >-
        Field to sort by. `date` is the transfer date of the tokens. Case-insensitive.
    - in: query
      name: direction
      schema:
        type: string
        enum:
          - ASC
          - DESC
        example: DESC
      description: >-
        Sort direction. Defaults to `ASC` when sorting by `name` and to `DESC` otherwise. Case-insensitive.
    - in: query
      name: pageNum
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
      description: >-
        The number of the requested page.
    - in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
        example: 10
      description: >-
        The size of the requested page.
  responses:
    '200':
      description: List of wearables owned by the given address
      content:
        application/json:
          schema:
            type: object
            required:
              - elements
              - pageNum
              - pageSize
              - totalAmount
            properties:
              elements:
                type: array
                items:
                  $ref: ../../components/schemas/lambdas/wearable.yaml
              totalAmount:
                type: number
              pageNum:
                type: number
              pageSize:
                type: number
          examples:
            default:
              $ref: ../../components/examples/lambdas/200-wearables-paginated.json
    '400':
      description: >-
        Invalid parameters: `includeEntities` combined with `includeDefinitions`, `pageSize` above 1000
        or an invalid `orderBy`/`direction` combination
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            default:
              value:
                error: Bad request
                message: Cannot use includeEntities and includeDefinitions together
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-internal-error.yaml
    '502':
      description: The wearables could not be fetched from the upstream sources
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
          examples:
            default:
              value:
                error: The requested items cannot be fetched right now
                message: Cannot fetch elements for 0xa87d168717538e86d71ac48baccaeb84162de602
    '503':
      description: An upstream source is saturated. Retry shortly.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/lambdas/lambdas-error.yaml
