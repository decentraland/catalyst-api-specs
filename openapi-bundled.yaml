          description: Ethereum address of the user
      responses:
        '200':
          description: Profile of the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profile'
              examples:
                default:
                  $ref: '#/components/examples/200-profiles-id'
        '404':
          description: The address has no deployed profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              examples:
                default:
                  value:
                    error: Not Found
                    message: Profile not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
        '503':
          description: An upstream source is saturated. Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
  /lambdas/profile/{id}:
    get:
      deprecated: true
      operationId: getAvatarDetailsLegacy
      summary: Get Avatar details (legacy)
      tags:
        - Lambdas
      description: 'Legacy alias of `/lambdas/profiles/{id}`. When the address has no deployed profile it responds 200 with `{ "avatars": [], "timestamp": 0 }` instead of 404.'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: '0x22480812a9a0669783c06d359182a583bd1d9fc2'
          description: Ethereum address of the user
      responses:
        '200':
          description: Profile of the user, or an empty profile when there is none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profile'
              examples:
                default:
                  $ref: '#/components/examples/200-profiles-id'
                not-found:
                  summary: No deployed profile
                  value:
                    avatars: []
                    timestamp: 0
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
        '503':
          description: An upstream source is saturated. Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
  /lambdas/outfits/{id}:
    get:
      operationId: getOutfits
      summary: Get Outfits
      tags:
        - Lambdas
      description: Given a Ethereum address of a user, return their Outfits entity. Outfits with wearables the user no longer owns are removed from the metadata, as are outfits in slots above 4 when the user owns no name.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: '0xa87d168717538e86d71ac48baccaeb84162de602'
          description: Ethereum address of the user
      responses:
        '200':
          description: Outfits entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entity'
              examples:
                default:
                  $ref: '#/components/examples/200-outfits-id'
        '404':
          description: The address has no Outfits entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              examples:
                default:
                  value:
                    error: Not Found
                    message: Outfits not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
        '502':
          description: The owned wearables or names could not be fetched from the upstream sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
        '503':
          description: An upstream source is saturated. Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
  /lambdas/third-party-integrations:
    get:
      operationId: getThirdPartyIntegrations
      summary: Returns the list of third party integrations as well as collections
      tags:
        - Lambdas
      description: Returns the list of third party integrations and collections
      responses:
        '200':
          description: Returns the list of third party integrations and collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/third-party-integrations'
              examples:
                default:
                  $ref: '#/components/examples/200-third-party-integrations'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
        '502':
          description: The third party providers could not be fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
  /explorer/{address}/wearables:
    get:
      operationId: getExplorerWearables
      summary: Explorer wearables
      tags:
        - Explorer
      description: Get a paginated list of the wearables owned by the given address, grouped by URN. Base, on-chain and third-party wearables are combined in a single list, then filtered, sorted and paginated.
      parameters:
        - $ref: '#/components/parameters/address'
        - name: collectionType
          in: query
          required: false
          description: Only return wearables of the given collection types. Repeat the parameter to request several. Defaults to all types. Any other value is rejected with a 400.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - base-wearable
                - on-chain
                - third-party
        - name: thirdPartyCollectionId
          in: query
          required: false
          description: Only return third-party wearables from the given third-party collections, identified by their URN (`urn:decentraland:{network}:collections-thirdparty:{thirdPartyName}`; any further segments are ignored). Repeat the parameter to request several. Values that are not third-party URNs are ignored. Defaults to all owned third-party wearables.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: isSmartWearable
          in: query
          required: false
          description: When `true`, only return on-chain smart wearables. Base and third-party wearables are excluded.
          schema:
            type: boolean
            default: false
        - name: network
          in: query
          required: false
          description: Only return on-chain wearables from this network. Base and third-party wearables are excluded. Any other value is ignored.
          schema:
            type: string
            enum:
              - ETHEREUM
              - MATIC
        - $ref: '#/components/parameters/category'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/rarity'
        - $ref: '#/components/parameters/order-by'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/page-num'
        - $ref: '#/components/parameters/page-size'
        - $ref: '#/components/parameters/trimmed'
        - $ref: '#/components/parameters/include-amount'
      responses:
        '200':
          description: Wearables owned by the given address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wearables-explorer'
              examples:
                default:
                  $ref: '#/components/examples/200-wearables-explorer'
                trimmed:
                  $ref: '#/components/examples/200-wearables-explorer-trimmed'
        '400':
          description: Invalid `collectionType`, `rarity`, `orderBy` or `direction`, or `pageSize` above 1000.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              example:
                error: Bad request
                message: 'Invalid collection type. Valid types are: base-wearable, on-chain, third-party.'
        '502':
          description: The owned wearables could not be fetched from their sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
        '503':
          description: The service is overloaded. Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
  /explorer/{address}/emotes:
    get:
      operationId: getExplorerEmotes
      summary: Explorer emotes
      tags:
        - Explorer
      description: Get a paginated list of the on-chain emotes owned by the given address, grouped by URN, then filtered, sorted and paginated.
      parameters:
        - $ref: '#/components/parameters/address'
        - name: collectionType
          in: query
          required: false
          description: Only return emotes of the given collection type. `on-chain` is the only type. Any other value is rejected with a 400.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - on-chain
        - $ref: '#/components/parameters/category'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/rarity'
        - $ref: '#/components/parameters/order-by'
        - $ref: '#/components/parameters/direction'
        - $ref: '#/components/parameters/page-num'
        - $ref: '#/components/parameters/page-size'
        - $ref: '#/components/parameters/trimmed'
        - $ref: '#/components/parameters/include-amount'
      responses:
        '200':
          description: Emotes owned by the given address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/emotes-explorer'
              examples:
                default:
                  $ref: '#/components/examples/200-emotes-explorer'
                trimmed:
                  $ref: '#/components/examples/200-emotes-explorer-trimmed'
        '400':
          description: Invalid `collectionType`, `rarity`, `orderBy` or `direction`, or `pageSize` above 1000.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              example:
                error: Bad request
                message: max allowed pageSize is 1000
        '502':
          description: The owned emotes could not be fetched from their sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
        '503':
          description: The service is overloaded. Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
components:
  schemas:
    about:
      type: object
      required:
        - healthy
        - acceptingUsers
        - configurations
        - content
        - lambdas
      properties:
        healthy:
          type: boolean
        acceptingUsers:
          type: boolean
        configurations:
          type: object
          required:
            - networkId
            - globalScenesUrn
            - scenesUrn
          properties:
            realmName:
              type: string
            networkId:
              type: number
            globalScenesUrn:
              type: array
              items:
                type: string
            scenesUrn:
              type: array
              items:
                type: string
            minimap:
              deprecated: true
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                dataImage:
                  type: string
                estateImage:
                  type: string
            map:
              type: object
              required:
                - sizes
                - minimapEnabled
              properties:
                minimapEnabled:
                  type: boolean
                sizes:
                  type: array
                  items:
                    type: object
                    properties:
                      top:
                        type: number
                      left:
                        type: number
                      bottom:
                        type: number
                      right:
                        type: number
                parcelView:
                  type: object
                  required:
                    - version
                  properties:
                    version:
                      type: string
                    imageUrl:
                      type: string
                satelliteView:
                  type: object
                  required:
                    - version
                  properties:
                    version:
                      type: string
                    baseUrl:
                      type: string
                    suffixUrl:
                      type: string
                    topLeftOffset:
                      type: object
                      properties:
                        x:
                          type: number
                        'y':
                          type: number
                thumbnailView:
                  type: object
                  required:
                    - version
                  properties:
                    version:
                      type: string
                    baseUrl:
                      type: string
                    suffixUrl:
                      type: string
                    topLeftOffset:
                      type: object
                      properties:
                        x:
                          type: number
                        'y':
                          type: number
            skybox:
              type: object
              properties:
                fixedHour:
                  type: number
                textures:
                  type: array
                  items:
                    type: string
        content:
          type: object
          required:
            - healthy
            - publicUrl
            - synchronizationStatus
          properties:
            synchronizationStatus:
              type: string
            healthy:
              type: boolean
            commitHash:
              type: string
            version:
              type: string
            publicUrl:
              type: string
        comms:
          type: object
          required:
            - healthy
            - protocol
          properties:
            healthy:
              type: boolean
            protocol:
              type: string
            commitHash:
              type: string
            version:
              type: string
            usersCount:
              type: number
            adapter:
              type: string
        lambdas:
          type: object
          required:
            - healthy
            - publicUrl
          properties:
            healthy:
              type: boolean
            commitHash:
              type: string
            version:
              type: string
            publicUrl:
              type: string
        bff:
          type: object
          required:
            - healthy
            - publicUrl
            - protocolVersion
          properties:
            healthy:
              type: boolean
            commitHash:
              type: string
            userCount:
              type: number
            publicUrl:
              type: string
            protocolVersion:
              type: string
    auth-chain:
      type: array
      items:
        required:
          - type
          - payload
        type: object
        properties:
          type:
            type: string
          payload:
            type: string
          signature:
            type: string
    audit-response:
      required:
        - version
        - localTimestamp
        - authChain
      type: object
      properties:
        version:
          type: string
        localTimestamp:
          type: number
        authChain:
          $ref: '#/components/schemas/auth-chain'
    error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    available-content:
      type: array
      items:
        required:
          - cid
          - available
        type: object
        properties:
          cid:
            type: string
          available:
            type: boolean
    errors:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            type: string
    entity:
      required:
        - version
        - id
        - type
        - timestamp
        - pointers
        - content
      type: object
      properties:
        version:
          type: string
        id:
          type: string
        type:
          type: string
        timestamp:
          type: number
        pointers:
          type: array
          items:
            type: string
        content:
          type: array
          items:
            type: object
            required:
              - file
              - hash
            properties:
              file:
                type: string
              hash:
                type: string
        metadata:
          type: object
    failed-deployments:
      type: array
      items:
        required:
          - entityType
          - entityId
          - failureTimestamp
          - reason
          - authChain
          - errorDescription
        type: object
        properties:
          entityType:
            type: string
          entityId:
            type: string
          failureTimestamp:
            type: number
          reason:
            type: string
          authChain:
            $ref: '#/components/schemas/auth-chain'
          errorDescription:
            type: string
          snapshotHash:
            type: string
            description: Hash of the snapshot the entity was found in, when it was synchronized from a snapshot
          retryCount:
            type: number
          nextRetryAt:
            type: number
            description: Timestamp after which the deployment will be retried
    pointer-changes:
      required:
        - deltas
      type: object
      properties:
        deltas:
          type: array
          items:
            required:
              - entityType
              - entityId
              - entityTimestamp
              - localTimestamp
              - pointers
              - authChain
            type: object
            properties:
              deploymentId:
                type: number
              entityType:
                type: string
              entityId:
                type: string
              entityTimestamp:
                type: number
              localTimestamp:
                type: number
              pointers:
                type: array
                items:
                  type: string
              deployerAddress:
                type: string
              version:
                type: string
              authChain:
                $ref: '#/components/schemas/auth-chain'
        filters:
          type: object
          description: Filters applied to the request
          properties:
            entityTypes:
              type: array
              items:
                type: string
            from:
              type: number
            to:
              type: number
            includeAuthChain:
              type: boolean
        pagination:
          type: object
          required:
            - offset
            - limit
            - moreData
          properties:
            offset:
              type: number
            limit:
              type: number
            moreData:
              type: boolean
              description: Whether there are more deployments after this page
            next:
              type: string
              description: Query string to request the next page, present when `moreData` is true
              example: '?to=1628612397349&limit=3&lastId=QmQSBke1rXUtPYHLJvJdrfX85n68YMSRgb4KeGhNL8w8KL'
    snapshots:
      type: array
      items:
        required:
          - hash
          - timeRange
          - numberOfEntities
          - generationTimestamp
        type: object
        properties:
          hash:
            type: string
          timeRange:
            required:
              - initTimestamp
              - endTimestamp
            type: object
            properties:
              initTimestamp:
                type: number
              endTimestamp:
                type: number
          replacedSnapshotHashes:
            type: array
            items:
              type: string
          numberOfEntities:
            type: number
          generationTimestamp:
            type: number
    status-content:
      required:
        - version
        - synchronizationStatus
        - commitHash
        - ethNetwork
      type: object
      properties:
        version:
          type: string
        commitHash:
          type: string
        ethNetwork:
          type: string
        synchronizationStatus:
          required:
            - lastSyncWithDAO
            - synchronizationState
          type: object
          properties:
            lastSyncWithDAO:
              type: number
              description: Timestamp of the last time the list of servers was refreshed from the DAO (0 if it hasn't happened yet)
            synchronizationState:
              type: string
              example: Syncing
              description: '`Bootstrapping` while the server is catching up with the rest of the network, during which it rejects new deployments; `Syncing` afterwards'
    deployments:
      required:
        - deployments
        - filters
        - pagination
      type: object
      properties:
        deployments:
          type: array
          items:
            required:
              - entityVersion
              - entityType
              - entityId
              - entityTimestamp
              - deployedBy
              - localTimestamp
            type: object
            properties:
              entityVersion:
                type: string
              entityType:
                type: string
              entityId:
                type: string
              entityTimestamp:
                type: number
              deployedBy:
                type: string
                description: Address of the deployer
              localTimestamp:
                type: number
                description: Timestamp at which this server stored the deployment
              pointers:
                type: array
                description: Present when `pointers` is in `fields`
                items:
                  type: string
              content:
                type: array
                description: Present when `content` is in `fields`
                items:
