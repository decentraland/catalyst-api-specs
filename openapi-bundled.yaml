  /lambdas/collections/contents/{urn}/thumbnail:
    get:
      operationId: getThumbnail
      summary: Download thumbnail image
      tags:
        - Lambdas
      description: Downloads the file referenced by the `thumbnail` metadata field of the active entity with the specified pointer. The `Content-Type` header is detected from the file contents. Supports a single byte range via the `Range` header and conditional requests via `If-None-Match`. Also served by the content server at `/content/queries/items/{urn}/thumbnail`.
      parameters:
        - in: path
          name: urn
          required: true
          schema:
            type: string
            example: urn:decentraland:matic:collections-v2:0x04e43281f36e1f1bfae6f38bc276cb48fb8ac632:0
          description: Pointer of the active entity, usually the URN of a wearable or emote
        - in: header
          name: Range
          required: false
          schema:
            type: string
            example: bytes=0-1023
          description: Single byte range to return, as `bytes=<start>-<end>`, `bytes=<start>-` or `bytes=-<suffix>`
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
            example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
          description: ETag of a cached copy. A match answers `304` without a body
      responses:
        '200':
          description: The file
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Byte ranges are supported
            Content-Length:
              schema:
                type: integer
              description: Size of the returned bytes
            Content-Encoding:
              schema:
                type: string
                example: gzip
              description: Present when the file is stored compressed
            Access-Control-Expose-Headers:
              schema:
                type: string
                example: ETag, Content-Range, Accept-Ranges, Content-Length
              description: Headers exposed to browsers
          content:
            image/*:
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range of the file
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Byte ranges are supported
            Content-Length:
              schema:
                type: integer
              description: Size of the returned bytes
            Content-Encoding:
              schema:
                type: string
                example: gzip
              description: Present when the file is stored compressed
            Access-Control-Expose-Headers:
              schema:
                type: string
                example: ETag, Content-Range, Accept-Ranges, Content-Length
              description: Headers exposed to browsers
            Content-Range:
              schema:
                type: string
                example: bytes 0-1023/461132
              description: Returned byte range and total size of the file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '304':
          description: The `If-None-Match` header matches the ETag of the file
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
        '404':
          description: No active entity with the specified pointer, the entity has no thumbnail, or it is denylisted
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Entity has no thumbnail.
        '416':
          description: The requested range can't be satisfied
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes */461132
              description: Total size of the file
    head:
      operationId: headThumbnail
      summary: Check the thumbnail of an item
      tags:
        - Lambdas
      description: Same as the GET request, without the body.
      parameters:
        - in: path
          name: urn
          required: true
          schema:
            type: string
            example: urn:decentraland:matic:collections-v2:0x04e43281f36e1f1bfae6f38bc276cb48fb8ac632:0
          description: Pointer of the active entity, usually the URN of a wearable or emote
        - in: header
          name: Range
          required: false
          schema:
            type: string
            example: bytes=0-1023
          description: Single byte range to return, as `bytes=<start>-<end>`, `bytes=<start>-` or `bytes=-<suffix>`
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
            example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
          description: ETag of a cached copy. A match answers `304` without a body
      responses:
        '200':
          description: The file exists
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Byte ranges are supported
            Content-Length:
              schema:
                type: integer
              description: Size of the returned bytes
            Content-Encoding:
              schema:
                type: string
                example: gzip
              description: Present when the file is stored compressed
            Access-Control-Expose-Headers:
              schema:
                type: string
                example: ETag, Content-Range, Accept-Ranges, Content-Length
              description: Headers exposed to browsers
        '206':
          description: The requested byte range can be served
          headers:
            ETag:
