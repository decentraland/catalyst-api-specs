      requestBody:
        required: true
        description: 'The body has 3 properties. The timestamp, the signedMessage that you wish to validate and the AuthChain. No other properties are allowed. <br/>The structure of the AuthChain is described as follows: <br/>- The first element of the chain is the original signer, and the one who will be used to validate against the blockchain <br/>- The last element of the chain contains the EHash and a signature <br/>- In between are ephemeral keys that can be used for signing'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/validate-signature-request'
            examples:
              default:
                $ref: '#/components/examples/body-validate-signature'
      responses:
        '200':
          description: Result of the signature validation with owner address or errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validate-signature-response'
              examples:
                valid-signature:
                  $ref: '#/components/examples/200-validate-signature-true'
                invalid-key:
                  $ref: '#/components/examples/200-validate-signature-false'
        '400':
          description: The body is not valid JSON or does not match the schema, the AuthChain has more than 10 links, or neither `signedMessage` nor `timestamp` is set
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/schema-validation-error'
                  - $ref: '#/components/schemas/lambdas-error'
              examples:
                invalid-body:
                  summary: Body does not match the schema
                  value:
                    ok: false
                    message: Invalid JSON body
                    data:
                      - instancePath: ''
                        schemaPath: '#/required'
                        keyword: required
                        params:
                          missingProperty: authChain
                        message: must have required property 'authChain'
                missing-message:
                  summary: Missing signed message
                  value:
                    error: Bad request
                    message: Expected 'signedMessage' property to be set
        '415':
          description: The `Content-Type` header is not `application/json`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema-validation-error'
              examples:
                default:
                  value:
                    ok: false
                    message: Content-Type must be application/json
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
  /lambdas/parcels/{x}/{y}/operators:
    get:
      operationId: getParcelOperators
      summary: Get the operators for a parcel
      tags:
        - Lambdas
      description: Get the owner of a parcel and the addresses allowed to operate it. When the parcel belongs to an estate, the owner, operator and update managers are those of the estate, and a parcel-level update operator takes precedence over the estate one.
      parameters:
        - in: path
          name: x
          required: true
          schema:
            type: integer
            example: 100
          description: X coordinate of the parcel
        - in: path
          name: 'y'
          required: true
          schema:
            type: integer
            example: 100
          description: Y coordinate of the parcel
      responses:
        '200':
          description: Owner and operators of the parcel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parcel-operators'
              examples:
                default:
                  $ref: '#/components/examples/200-parcel-operators'
        '400':
          description: The coordinates are not numbers or are outside the map
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              examples:
                invalid-coordinates:
                  summary: Invalid coordinate format or range
                  value:
                    error: Bad request
                    message: Coordinates X and Y must be valid numbers in a valid range
        '404':
          description: No parcel or estate was found for the coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              examples:
                not-found:
                  summary: Parcel not found
                  value:
                    error: Bad Request
                    message: 'Parcel or estate rights not found for x: 100, y: 100'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
  /lambdas/profiles:
    post:
      operationId: getAvatarsDetailsByPost
      summary: Get Avatars details
      tags:
        - Lambdas
      description: Returns the profiles of the Ethereum addresses in the body. Addresses without a deployed profile are omitted from the response.
      parameters:
        - in: header
          name: If-Modified-Since
          schema:
            type: string
            example: Wed, 21 Oct 2025 07:28:00 GMT
          description: HTTP date. If none of the requested profiles was modified after it, the response is a 304 with no body.
      requestBody:
        required: true
        description: The body only has the `ids` property representing a list of Ethereum addresses
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/post-profiles'
            examples:
              default:
                $ref: '#/components/examples/post-profiles'
      responses:
        '200':
          description: Array of Avatars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/profile'
              examples:
                default:
                  $ref: '#/components/examples/200-profiles-ids'
        '304':
          description: No profile was modified since `If-Modified-Since` header
        '400':
          description: '`ids` is missing, empty or has more than 1000 addresses'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              examples:
                missing-ids:
                  summary: Missing ids
                  value:
                    error: Bad request
                    message: No profile ids were specified. Expected ids:string[] in body
                too-many-ids:
                  summary: Too many ids
                  value:
                    error: Bad request
                    message: Too many profile ids were specified. Maximum allowed is 1000
        '500':
          description: Internal Server Error, also returned when the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
        '503':
          description: An upstream source is saturated. Retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
  /lambdas/profiles/{id}:
    get:
      operationId: getAvatarDetails
      summary: Get Avatar details
      tags:
