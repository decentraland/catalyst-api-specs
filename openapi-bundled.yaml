  parameters:
    address:
      name: address
      in: path
      required: true
      description: Ethereum address of the owner.
      schema:
        type: string
        example: '0xa87d168717538e86d71ac48baccaeb84162de602'
    category:
      name: category
      in: query
      required: false
      description: Only return elements of the given category (case-insensitive). Repeat the parameter to match any of several categories.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
        example:
          - upper_body
    name:
      name: name
      in: query
      required: false
      description: Only return elements whose name contains this text (case-insensitive).
      schema:
        type: string
    rarity:
      name: rarity
      in: query
      required: false
      description: Only return elements of this rarity. Elements without rarity are excluded. Any other value is rejected with a 400.
      schema:
        type: string
        enum:
          - common
          - uncommon
          - rare
          - epic
          - legendary
          - exotic
          - mythic
          - unique
    order-by:
      name: orderBy
      in: query
      required: false
      description: Field to sort by. `rarity` sorts by rarity tier, `name` alphabetically and `date` by transfer date (most recent transfer for `DESC`, oldest for `ASC`). Elements without the field, such as base or third-party wearables for `rarity` and `date`, go last with `DESC` and first with `ASC`. Ties are broken by URN.
      schema:
        type: string
        enum:
          - rarity
          - name
          - date
        default: rarity
    direction:
      name: direction
      in: query
      required: false
      description: Sort direction. Defaults to `ASC` when `orderBy` is `name` and to `DESC` otherwise.
      schema:
        type: string
        enum:
          - ASC
          - DESC
    page-num:
      name: pageNum
      in: query
      required: false
      description: Number of the requested page, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    page-size:
      name: pageSize
      in: query
      required: false
      description: Number of elements per page. Values above 1000 are rejected with a 400.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    trimmed:
      name: trimmed
      in: query
      required: false
      description: 'When `true`, each element is returned in its trimmed form: a reduced entity with only the fields needed to render the backpack. Otherwise the full form is returned.'
      schema:
        type: boolean
        default: false
    include-amount:
      name: includeAmount
      in: query
      required: false
      description: When `true` together with `trimmed`, adds the number of owned copies as `amount` to each trimmed element. Ignored without `trimmed`.
      schema:
        type: boolean
        default: false
