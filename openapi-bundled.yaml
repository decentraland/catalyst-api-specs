  /lambdas/collections/wearables:
    get:
      deprecated: true
      operationId: searchWearables
      summary: Search Wearables
      tags:
        - Lambdas
      description: Search the wearables catalog, base wearables included, and retrieve their definitions. At least one of `textSearch`, `collectionId` or `wearableId` is required. Results are sorted by URN, base wearables first, and paginated with the `lastId` cursor.
      parameters:
        - in: query
          name: collectionId
          schema:
            type: array
            items:
              type: string
            example:
              - urn:decentraland:ethereum:collections-v1:mf_sammichgamer
          style: form
          explode: true
          description: Collection URN to search in. Can be repeated up to 500 times.
        - in: query
          name: wearableId
          schema:
            type: array
            items:
              type: string
            example:
              - urn:decentraland:ethereum:collections-v1:binance_us_collection:binance_us_hat
          style: form
          explode: true
          description: Wearable URN to retrieve. Can be repeated up to 500 times.
        - in: query
          name: textSearch
          schema:
            type: string
            minLength: 3
            example: Hoodie
          description: Text to search for in the wearables. Case-insensitive, at least 3 characters.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
            example: 2
          description: Maximum number of wearables to return. Values that are not a number between 1 and 500 fall back to 500.
        - in: query
          name: lastId
          schema:
            type: string
            example: urn:decentraland:ethereum:collections-v1:binance_us_collection:binance_us_hat
          description: URN of the last wearable of the previous page. Only wearables with a greater URN are returned.
      responses:
        '200':
          description: Wearables matching the filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/wearables'
              examples:
                default:
                  $ref: '#/components/examples/200-wearables'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-error'
              examples:
                MissingFilter:
                  summary: Missing Filter
                  value:
                    error: Bad request
                    message: 'You must use one of the filters: ''textSearch'', ''collectionId'' or ''wearableId'''
                TextSearch:
                  summary: Bad search text
                  value:
                    error: Bad request
                    message: The text search must be at least 3 characters long
                Ids:
                  summary: Too many wearable ids
                  value:
                    error: Bad request
                    message: You can't ask for more than 500 wearables
                Collection:
                  summary: Too many collection ids
                  value:
                    error: Bad request
                    message: You can't filter for more than 500 collection ids
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lambdas-internal-error'
