openapi: 3.0.3
info:
  title: API Specification for the Decentraland Catalyst Server (BETA)
  version: '1.0'
  description: 'A Catalyst is a Server that runs different services. These services currently work as the backbone for Decentraland and work in a decentralized network. The current specification details the following services: <br/><br/>- Content Server <br/>- Lambdas Service <br/>- Explorer <br/> <br/>WARNING: We are working to close the version 1.0 of the Catalyst Protocol defined by this API. So far this is what we have and it''s public but we are still working on refinement and during this process we may decided to deprecate or change some of the endpoints.'
  x-logo:
    url: https://cryptologos.cc/logos/decentraland-mana-logo.png
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://peer.decentraland.zone
    description: Catalyst Development instance
  - url: https://peer-testing.decentraland.org
    description: Catalyst Staging instance
  - url: https://peer.decentraland.org
    description: First production Catalyst node
tags:
  - name: Global
    description: Endpoints that are about the whole catalyst or about shared services
  - name: Content Server
    description: Decentraland is a virtual world that is owned by its users. One of the biggest differentiators about Decentraland is its level of decentralization. Users can own LAND, wearables, and probably other types of items in the future. Each of these items is an NFT in itself, and therefore ownership is determined by the Ethereum (or EVM-compatible) blockchain. <br/><br/>Now, when a new wearable is created, or when a user uploads a scene to their LAND/parcel, all necessary files (3d models, textures, music, etc) are uploaded to a "content server". Why are we using these servers instead of the blockchain? Mainly because it would be prohibitively expensive to store files as big as 3d models in the blockchain. Users would have to pay fees so high to upload content to their parcels that nobody would do it. <br/><br/>So this is where content servers come into play. The content server is mainly a server where users can upload these files we mentioned before. Each server will verify against the blockchain that the user making the upload is actually allowed to do so. For example, in the case of scenes, the server will check that the deployer owns all the parcels they are trying to modify. <br/><br/>And the most important part is that all content servers will then sync with each other. So, for example, if a scene is modified in one server, the update itself will be broadcasted to the other ones. Then, in the case a content server goes down for some reason, all content will still be present in the other ones.
  - name: Lambdas
    description: This service provides a set of utilities required by the Catalyst Server Clients\Consumers in order to retrieve or validate data.
  - name: Explorer
    description: Endpoints used by Explorers to list the wearables and emotes owned by an address, for example to populate the backpack.
paths:
  /about:
    get:
      operationId: getAboutCatalystInfo
      summary: Catalyst Server Configs and health
      tags:
        - Global
      description: Retrieve detailed information about the services health and its configuration
      responses:
        '200':
          description: Catalyst services health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/about'
              examples:
                default:
                  $ref: '#/components/examples/200-about'
        '503':
          description: Service Unavailable - Some catalyst service is not Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/about'
              examples:
                default:
                  $ref: '#/components/examples/503-about'
  /content/audit/{entityType}/{entityId}:
    get:
      operationId: getEntityAuditInformation
      summary: Get information about an entity
      tags:
        - Content Server
      parameters:
        - in: path
          name: entityType
          required: true
          schema:
            type: string
            enum:
              - profile
              - scene
              - wearable
              - emote
              - store
              - outfits
            example: profile
          description: Type of the entity to audit.
        - in: path
          name: entityId
          required: true
          schema:
            type: string
            example: QmQgezF4UWTZpD5VqKs2AGCzucRJdm8zU87MxdSRH9heZR
          description: id of the entity
      description: Get the audit information (entity version, deployment local timestamp and auth chain) of the deployment of the entity with the specified type and id. Entities that are no longer active and denylisted entities are included.
      security: []
      responses:
        '200':
          description: Entity version, deployment local timestamp and auth chain
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/audit-response'
              examples:
                default:
                  $ref: '#/components/examples/200-audit-response'
        '400':
          description: Unrecognized Entity type
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: 'Unrecognized type: Houses'
        '404':
          description: No deployment found for the entity type and id
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: No deployment found
  /content/challenge:
    get:
      operationId: getChallenge
      summary: Validate if the Server is part of the DAO
      tags:
        - Content Server
      description: Used by the Server to figure out their identity on the DAO by themselves, so they will generate a random challenge text, and then query each server for it. If the text matches, then they have found themselves.
      responses:
        '200':
          description: Challenge text
          content:
            application/json; charset=utf-8:
              schema:
                required:
                  - challengeText
                type: object
                properties:
                  challengeText:
                    type: string
              example:
                challengeText: 186a1c51-2c4c-4dae-913c-b87670600c56
  /content/contents/{hashId}:
    get:
      operationId: getContentFile
      summary: Download content file
      tags:
        - Content Server
      description: Download the binary file associated with the specified hashId. Supports a single byte range via the `Range` header and conditional requests via `If-None-Match`. Downloads are rate limited per client. The `Content-Type` is `application/octet-stream` by default; with `includeMimeType` it is the type detected from the file contents (falling back to `application/octet-stream`).
      parameters:
        - in: path
          name: hashId
          required: true
          schema:
            type: string
            example: QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu
          description: Hash of the file to be retrieved, you can search for the hashId in the content section of a deployment. If the entity version greater than or equal to v4, then the hashing algorithm will be IPFS, if the entity version is v3 or below then it will be SHA-256
        - in: query
          name: includeMimeType
          required: false
          allowEmptyValue: true
          schema:
            type: string
          description: When present (with any value), the `Content-Type` header is detected from the file contents. Otherwise it is `application/octet-stream`.
        - in: header
          name: Range
          required: false
          schema:
            type: string
            example: bytes=0-1023
          description: Single byte range to return, as `bytes=<start>-<end>`, `bytes=<start>-` or `bytes=-<suffix>`
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
            example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
          description: ETag of a cached copy. A match answers `304` without a body
      responses:
        '200':
          description: The file
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Byte ranges are supported
            Content-Length:
              schema:
                type: integer
              description: Size of the returned bytes
            Content-Encoding:
              schema:
                type: string
                example: gzip
              description: Present when the file is stored compressed
            Access-Control-Expose-Headers:
              schema:
                type: string
                example: ETag, Content-Range, Accept-Ranges, Content-Length
              description: Headers exposed to browsers
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            '*/*':
              schema:
                type: string
                format: binary
        '206':
          description: The requested byte range of the file
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Byte ranges are supported
            Content-Length:
              schema:
                type: integer
              description: Size of the returned bytes
            Content-Encoding:
              schema:
                type: string
                example: gzip
              description: Present when the file is stored compressed
            Access-Control-Expose-Headers:
              schema:
                type: string
                example: ETag, Content-Range, Accept-Ranges, Content-Length
              description: Headers exposed to browsers
            Content-Range:
              schema:
                type: string
                example: bytes 0-1023/461132
              description: Returned byte range and total size of the file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            '*/*':
              schema:
                type: string
                format: binary
        '304':
          description: The `If-None-Match` header matches the ETag of the file
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
        '404':
          description: No file with the specified hashId, the hashId is not a valid content hash, or the file is denylisted
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: No content found with hash QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu
        '416':
          description: The requested range can't be satisfied
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes */461132
              description: Total size of the file
        '429':
          description: Too many requests from this client
          headers:
            Retry-After:
              schema:
                type: integer
                example: 30
              description: Seconds to wait before retrying the request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Too many requests
    head:
      operationId: headContentFile
      summary: Check if a content file exists
      tags:
        - Content Server
      description: Same as the GET request, without the body. Useful to check whether a file exists and read its headers. The `Content-Type` is `application/octet-stream` by default; with `includeMimeType` it is the type detected from the file contents.
      parameters:
        - in: path
          name: hashId
          required: true
          schema:
            type: string
            example: QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu
          description: Hash of the file to be retrieved, you can search for the hashId in the content section of a deployment. If the entity version greater than or equal to v4, then the hashing algorithm will be IPFS, if the entity version is v3 or below then it will be SHA-256
        - in: query
          name: includeMimeType
          required: false
          allowEmptyValue: true
          schema:
            type: string
          description: When present (with any value), the `Content-Type` header is detected from the file contents. Otherwise it is `application/octet-stream`.
        - in: header
          name: Range
          required: false
          schema:
            type: string
            example: bytes=0-1023
          description: Single byte range to return, as `bytes=<start>-<end>`, `bytes=<start>-` or `bytes=-<suffix>`
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
            example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
          description: ETag of a cached copy. A match answers `304` without a body
      responses:
        '200':
          description: The file exists
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Byte ranges are supported
            Content-Length:
              schema:
                type: integer
              description: Size of the returned bytes
            Content-Encoding:
              schema:
                type: string
                example: gzip
              description: Present when the file is stored compressed
            Access-Control-Expose-Headers:
              schema:
                type: string
                example: ETag, Content-Range, Accept-Ranges, Content-Length
              description: Headers exposed to browsers
        '206':
          description: The requested byte range can be served
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
            Accept-Ranges:
              schema:
                type: string
                example: bytes
              description: Byte ranges are supported
            Content-Length:
              schema:
                type: integer
              description: Size of the returned bytes
            Content-Encoding:
              schema:
                type: string
                example: gzip
              description: Present when the file is stored compressed
            Access-Control-Expose-Headers:
              schema:
                type: string
                example: ETag, Content-Range, Accept-Ranges, Content-Length
              description: Headers exposed to browsers
            Content-Range:
              schema:
                type: string
                example: bytes 0-1023/461132
              description: Returned byte range and total size of the file
        '304':
          description: The `If-None-Match` header matches the ETag of the file
          headers:
            ETag:
              schema:
                type: string
                example: '"QmVzr55TyXcrbQUWBN6rf7K7zkZsTFnBK19LvgYM9CxFbu"'
              description: Double-quoted hash of the file
            Cache-Control:
              schema:
                type: string
                example: public,max-age=31536000,s-maxage=31536000,immutable
              description: Files are immutable and can be cached indefinitely
        '404':
          description: No file with the specified hashId, the hashId is not a valid content hash, or the file is denylisted
        '416':
          description: The requested range can't be satisfied
          headers:
            Content-Range:
              schema:
                type: string
                example: bytes */461132
              description: Total size of the file
        '429':
          description: Too many requests from this client
          headers:
            Retry-After:
              schema:
                type: integer
                example: 30
              description: Seconds to wait before retrying the request.
  /content/contents/{hashId}/active-entities:
    get:
      operationId: getEntityIdsByHashId
      summary: List of entityIds associated with a hashId
      tags:
        - Content Server
      description: Get the list of active entity ids whose deployments reference the specified content hash. Denylisted entities are omitted and the list is capped at 15000 ids. This endpoint is currently intended for troubleshooting as there is no specific use case for it.
      parameters:
        - in: path
          name: hashId
          required: true
          schema:
            type: string
            example: QmWFLwHGfvhB9a1epaRpS38HEwbHvhpaYzHEsNhDRgon7P
          description: Hash of the content file
      responses:
        '200':
          description: List of all the entities associated with the hashId
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  type: string
              example:
                - QmY4GFuf2jR3ocfuXuFLgvUrGEpjo84Byg44Pv2wduuinW
                - QmZbAEFPF7LSq9xVZTCAZoHPNV1QX7YiSbKL2g881MJLj8
        '404':
          description: No active entity references the specified hash
          content:
            application/json; charset=utf-8:
              schema:
                required:
                  - error
                type: object
                properties:
                  error:
                    type: string
              example:
                error: The entity was not found
  /content/available-content:
    get:
      operationId: getAvailableContent
      summary: Validates if file exists on the Server
      tags:
        - Content Server
      description: Given a list of hashes, validates if the corresponding files exist in the storage of the server. Denylisted hashes are omitted from the response.
      parameters:
        - in: query
          name: cid
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 1000
            items:
              type: string
              example: QmWFLwHGfvhB9a1epaRpS38HEwbHvhpaYzHEsNhDRgon7P
          description: Hash of the content file. Repeat the parameter to check several files (up to 1000).
      responses:
        '200':
          description: List of objects with the hasIds and a boolean value specifying 'true' if the files exists on the server and 'false' if it doesn't.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/available-content'
              examples:
                default:
                  $ref: '#/components/examples/200-available-content'
        '400':
          description: No `cid` was set, or more than 1000 were requested
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                missing:
                  summary: No cid set
                  value:
                    error: Please set at least one cid.
                tooMany:
                  summary: Too many cids
                  value:
                    error: Too many cids requested; the maximum allowed is 1000.
  /content/entities:
    post:
      operationId: postEntity
      summary: Deploys an entity
      tags:
        - Content Server
      description: |-
        Deploys an entity in the content server. This request must contain a file with the entity itself and also the files associated with it, such as 3D models, as well as information about the entity and requester. This request will succeed only if the hash of the entity file matches the entityId and also if the signature is valid has the correct permission to modify the pointers associated with it.

        **Partial (batched) deployments** ([ADR-325](https://adr.decentraland.org/adr/ADR-325)). A scene too large for one request can be uploaded across several requests that set `partial` to `true`, each carrying a subset of its content files keyed by their content hash. The signed `entityId` identifies the upload. Every request except the completing one answers `202` with the content hashes still missing; the request after which all content is stored validates and publishes the entity and answers `200`. Repeating a partial request with the `partial=true` query parameter for an already published entity answers `200` with the original `creationTimestamp`; without the query parameter, a source that has spent its daily quota gets `429` instead. Partial deployments apply to scenes only, and uploads expire a fixed time after the first request. Clients should send every batch as `POST /entities?partial=true` with the `partial` form field set to `true` as well: the query parameter declares the batch before the body is read. Clients should send `Content-Length` on every request and retry `429` and `503` only after the `Retry-After` delay.
      parameters:
        - name: partial
          in: query
          required: false
          schema:
            type: string
            example: 'true'
          description: Declares the request as a partial deployment batch before its body is read when set to the literal string `true`; any other value is ignored. It must be accompanied by the `partial` form field set to `true`, otherwise the request is rejected with `400`. Batches that omit it are still accepted, but a source that has spent its daily quota of regular deployments is rejected with `429` before its body is read unless this parameter is present.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                entityId:
                  type: string
                  example: QmY4GFuf2jR3ocfuXuFLgvUrGEpjo84Byg44Pv2wduuinW
                authChain:
                  type: string
                  example:
                    - type: SIGNER
                      payload: '0x716954738e57686a08902d9dd586e813490fee23'
                    - type: ECDSA_EPHEMERAL
                      payload: |-
                        Decentraland Login
                        Ephemeral address: 0x90a43461d3e970785B945FFe8f7628F2BC962D6a
                        Expiration: 2021-07-10T20:55:42.215Z
                      signature: '0xe64e46fdd7d8789c0debec54422ae77e31b77e5a28287e072998e1114e252c57328c17756400d321e9e77032347c9d05e63fb59a3b6c3ab754565f9db86b8c481b'
                    - type: ECDSA_SIGNED_ENTITY
                      payload: QmNMZBy7khBxdigikA8mcJMyv6yeBXfMv3iAcUiBr6n72C
                      signature: '0xbed22719dcdc19580353108027c41c65863404879592c65014d806efa961c629777adc76986193eaee4e48f278ec59feb1c289827254230af85b2955157ec8061b'
                ethAddress:
                  type: string
                  deprecated: true
                  description: Ignored. The signer is taken from `authChain`.
                  example: '0x89205A3A3b2A69De6Dbf7f01ED13B2108B2c43e7'
                signature:
                  type: string
                  deprecated: true
                  description: Ignored. The signature is taken from `authChain`.
                partial:
                  type: string
                  example: 'true'
                  description: Marks the request as one batch of a partial deployment when set to the literal string `true`; any other value makes it a regular deployment. Send it together with the `partial=true` query parameter. The entity file (the multipart file keyed by `entityId`) is required on the first batch. Only the signer who started the upload may add batches, and may omit the entity file on later ones while the upload is live.
      responses:
        '200':
          description: Entity created successfully. The response will contain the timestamp and result.
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required:
                  - creationTimestamp
                properties:
                  creationTimestamp:
                    type: number
              example:
                creationTimestamp: 1628607669304
        '202':
          description: 'Partial deployment batch accepted. The files in this request are stored but the entity is not published yet. `missing` lists the content hashes the server still needs for this upload and is authoritative: send those hashes in further partial requests.'
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required:
                  - missing
                properties:
                  missing:
                    type: array
                    items:
                      type: string
              example:
                missing:
                  - bafkreigdkbkfpqr4fn2xkxpbh6hcxdxdzxvnyqubjx3pzh7hmi4ctbcxtq
        '400':
          description: 'Bad request. Returns the error object with the list of errors from the server response. For partial deployments it means the request can never succeed and must not be retried for the same entity: an invalid signature or entity, a file whose hash doesn''t match its field name, an upload started by another account, an expired upload, a newer entity already deployed on the pointers, a scene over its size limit, or an upload or batch larger than a quota on its own. A batch without the entity file is rejected with this status when the server can''t use its stored copy (missing, or not matching `entityId`); resending the batch with the entity file replaces the stored copy. A request with the `partial=true` query parameter whose `partial` form field is missing or not `true` is rejected with this status before anything is deployed. Partial batches rejected with this status before joining their upload count against the source''s daily quota of regular deployments, except malformed requests the multipart parser rejects (not multipart, duplicate or malformed fields).'
          content:
            application/json; charset=utf-8:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error'
                  - $ref: '#/components/schemas/errors'
              examples:
                partialQueryWithoutFormField:
                  summary: The query parameter declares a partial batch but the form does not
                  value:
                    error: The 'partial=true' query parameter requires the 'partial=true' form field
        '408':
          description: The request body didn't arrive in time. Retry the request.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
        '413':
          description: 'The multipart body exceeds a size or count limit: a file, the whole request (including a declared `Content-Length` over the cap), the number of files or form fields, or a field''s size. For partial deployments, split the content into smaller batches.'
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
        '429':
          description: |-
            A quota that frees with time. Retry the request after the `Retry-After` delay; staged files
            are kept. Causes include:

            - The source has spent its daily quota of regular deployments. Requests without the
              `partial=true` query parameter are rejected before their body is read, and partial batches
              may only continue an upload the same signer started.
            - Too many concurrent uploads, bytes in flight or requests per minute from the source.
            - For partial deployments, a quota on uploads in progress or staged bytes (per account, per
              parcel or per server), on accepted bytes per minute, the pointers' deployment rate limit, or
              another deployment in progress on the same pointers. See the
              [ADR-325 quotas](https://adr.decentraland.org/adr/ADR-325#quotas).
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
              description: Seconds to wait before retrying the request.
              required: true
          content:
            application/json; charset=utf-8:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error'
                  - $ref: '#/components/schemas/errors'
        '500':
          description: Unexpected server error.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
        '503':
          description: The server is temporarily unable to process the request, for example while it is bootstrapping, busy or out of upload capacity, or when publishing a completed partial upload fails. A partial upload stays live; retry the request after the `Retry-After` delay.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 10
              description: Seconds to wait before retrying the request.
          content:
            application/json; charset=utf-8:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/error'
                  - $ref: '#/components/schemas/errors'
  /content/entities/active/collections/{collectionUrn}:
    get:
      operationId: getEntitiesByPointerPrefix
      summary: List of active entities matching urn prefix
      tags:
        - Content Server
      description: Returns a page of the active entities which have at least one pointer that matches the given collection URN or third party id as a prefix. Denylisted entities are omitted from `entities` but still counted in `total`.
      parameters:
        - in: path
          name: collectionUrn
          required: true
          schema:
            type: string
            example: urn:decentraland:matic:collections-v2:0x8e674db9b2fc0759b2d94cace9c4bae334a8f0c3
          description: URN of a collection (`collections-v1`, `collections-v2`, `base-avatars`, `base-emotes`) or a third party id (`collections-thirdparty`) to filter the entities by
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Page size
        - in: query
          name: pageNum
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1
      responses:
        '200':
          description: Total number of matching entities and the entities of the requested page
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required:
                  - total
                  - entities
                properties:
                  total:
                    type: number
                  entities:
                    type: array
                    items:
                      $ref: '#/components/schemas/entity'
              examples:
                default:
                  $ref: '#/components/examples/200-active-collections'
        '400':
          description: Invalid URN, a URN that is not a collection or third party id, or invalid pagination
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                invalidUrn:
                  summary: Invalid URN
                  value:
                    error: 'Invalid URN format: foo'
                pageSize:
                  summary: Page size too large
                  value:
                    error: max allowed pageSize is 1000
  /content/entities/active:
    post:
      operationId: getActiveEntities
      summary: List active entities by pointers or ids
      tags:
        - Content Server
      description: Returns the active entities with the specified ids or pointers. Exactly one of `ids` or `pointers` must be set in the body, with between 1 and 1000 values. Denylisted entities are omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pointers:
                  description: Entities must be filtered by pointer XOR entityId (ids). Use this parameter if you want to retrieve the active entities on these pointers.
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    minLength: 1
                    example: urn:decentraland:mumbai:collections-v2:0xf6426e0c70c17509038aba78137e721d187499d6:0
                ids:
                  description: Entities must be filtered by pointer (pointers) XOR entityId. Use this parameter if you want to retrieve the active entities with these entityIds.
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    minLength: 1
                    example: QmeA8RpAtqU6gCebNaWRXtM9nQs3ugzzbeQm3L7uKrP4Jp
      responses:
        '200':
          description: List of entities corresponding to the matching ids or pointers.
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/entity'
              examples:
                default:
                  $ref: '#/components/examples/200-entities-active'
        '400':
          description: 'Bad request: the body is not valid JSON, or doesn''t contain exactly one of `ids` or `pointers` as a list of 1 to 1000 non-empty strings'
          content:
            application/json; charset=utf-8:
              schema:
                type: object
                required:
                  - ok
                  - message
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                  data:
                    type: array
                    description: Schema validation errors
                    items:
                      type: object
              examples:
                default:
                  value:
                    ok: false
                    message: Invalid JSON body
                    data:
                      - instancePath: ''
                        schemaPath: '#/oneOf'
                        keyword: oneOf
                        params:
                          passingSchemas: null
                        message: must match exactly one schema in oneOf
        '413':
          description: The request body is larger than the server limit (10 MB by default)
          content:
            text/plain:
              schema:
                type: string
                example: Payload Too Large
  /content/failed-deployments:
    get:
      operationId: getFailedDeployments
      summary: List of failed deployments
      description: Retrieves the deployments this server failed to synchronize from other servers and will retry. Without `offset` and `limit` the whole list is returned; with either of them, a page of at most 1000 items is returned.
      tags:
        - Content Server
      parameters:
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of failed deployments to skip
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 1000
          description: Maximum number of failed deployments to return
      responses:
        '200':
          description: Failed deployments list
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/failed-deployments'
              examples:
                default:
                  $ref: '#/components/examples/200-failed-deployments'
  /content/pointer-changes:
    get:
      operationId: getPointerChanges
      summary: List of changes made to a pointer
      tags:
        - Content Server
      description: Paginated list of the deployments that changed the entity a pointer resolves to, most recent first by default. Use the `next` field of the pagination to fetch the following page.
      parameters:
        - in: query
          name: from
          allowEmptyValue: true
          schema:
            type: integer
            example: 1606829553969
          description: Minimum timestamp (in milliseconds) of the deployments to return. It applies to the field set in `sortingField`, local timestamp by default.
        - in: query
          name: to
          allowEmptyValue: true
          schema:
            type: integer
            example: 1606829553969
          description: Maximum timestamp (in milliseconds) of the deployments to return. It applies to the field set in `sortingField`, local timestamp by default.
        - in: query
          name: lastId
          allowEmptyValue: true
          schema:
            type: string
            example: QmNknKv8MuKbfZ73z4QdUEsNbTd1ZAN1fSuwTFGiNGeCt5
          description: It is the last entity id that was visited, so it will be skipped when showing current page.
        - in: query
          name: offset
          allowEmptyValue: true
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 0
          description: Number of deployments to skip. It can't be higher than 5000; use the `next` field of the pagination to go further.
        - in: query
          name: limit
          allowEmptyValue: true
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
            example: 100
          description: The deployments are a paginated collection, this parameter corresponds to the limit for each page. Values out of range fall back to 500.
        - in: query
          name: entityType
          allowEmptyValue: true
          schema:
            type: array
            items:
              type: string
              enum:
                - scene
                - profile
                - wearable
                - emote
                - store
                - outfits
              example: profile
          description: The type of entities that will be shown in the collection. Repeat the parameter to filter by several types.
        - in: query
          name: sortingField
          schema:
            type: string
            enum:
              - local_timestamp
              - entity_timestamp
            example: local_timestamp
          description: This value is used as the field to order all the deployments in the collection. If no parameter is sent, then the default field to order with will be local_timestamp.
        - in: query
          name: sortingOrder
          schema:
            type: string
            enum:
              - ASC
              - DESC
            example: ASC
          description: This value is used as the order for all the deployments in the collection. If no parameter is sent, then the default field to order with will be DESC.
      responses:
        '200':
          description: List of deployment changes made to pointers
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/pointer-changes'
              examples:
                default:
                  $ref: '#/components/examples/200-pointer-changes'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                entityType:
                  summary: EntityType not recognized
                  value:
                    error: Found an unrecognized entity type
                offset:
                  summary: Wrong offset value
                  value:
                    error: Offset can't be higher than 5000. Please use the 'next' property for pagination.
                sortingField:
                  summary: Sorting field not recognized
                  value:
                    error: Found an unrecognized sort field param
                sortingOrder:
                  summary: Sorting order not recognized
                  value:
                    error: Found an unrecognized sort order param
  /content/snapshots:
    get:
      operationId: getSnapshots
      summary: Snapshots with a list of active entities
      tags:
        - Content Server
      description: Lists all active deployments stored in the database in multiple snapshots for different time ranges. If the information needed is front in time of the most recent snapshot, you may use the `/content/pointer-changes` endpoint with the necessary `from` filter.
      responses:
        '200':
          description: The result is a list of snapshots. Each "hash" field references the a snapshot with all the active entities that has an entity timestamp within the specified time range. Each hash is a reference to a JSON file containing one line per entity in a JSON format. Once you get the hashes you can download them using the /content/contents/{hashId} endpoint.
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/snapshots'
              examples:
                default:
                  $ref: '#/components/examples/200-snapshots'
        '503':
          description: The server hasn't generated its snapshots yet
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: New Snapshots not yet created
  /content/status:
    get:
      operationId: getContentStatus
      summary: Content Server status
      tags:
        - Content Server
      description: Retrieve the version, network and synchronization state of the content server
      responses:
        '200':
          description: Content Server status information
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/status-content'
              examples:
                default:
                  $ref: '#/components/examples/200-status-content'
  /content/deployments:
    get:
      operationId: getDeployments
      summary: List of deployments
      deprecated: true
      tags:
        - Content Server
      description: Paginated history of the deployments stored in the server, most recent first by default. Use the `next` field of the pagination to fetch the following page. This endpoint is deprecated and heavily rate limited; use `/content/pointer-changes`, `/content/snapshots` or `/content/entities/active` instead.
      parameters:
        - in: query
          name: from
          schema:
            type: integer
            example: 1606829553969
          description: Minimum timestamp (in milliseconds) of the deployments to return. It applies to the field set in `sortingField`, local timestamp by default.
        - in: query
          name: to
          schema:
            type: integer
            example: 1606829553969
          description: Maximum timestamp (in milliseconds) of the deployments to return. It applies to the field set in `sortingField`, local timestamp by default.
        - in: query
          name: entityType
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
              enum:
                - scene
                - profile
                - wearable
                - emote
                - store
                - outfits
          description: Type of the entities to return. Repeat the parameter to filter by several types.
        - in: query
          name: entityId
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
          description: Id of the entities to return. Repeat the parameter to filter by several ids.
        - in: query
          name: pointer
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
              example: 0,0
          description: Return deployments affecting any of these pointers. Repeat the parameter to filter by several pointers.
        - in: query
          name: onlyCurrentlyPointed
          schema:
            type: boolean
          description: When `true`, only active deployments (not overwritten by a newer one) are returned
        - in: query
          name: fields
          schema:
            type: string
            example: pointers,content,metadata,auditInfo
          description: Comma separated list of the optional fields to include in each deployment, among `pointers`, `content`, `metadata` and `auditInfo`. Defaults to `pointers,content,metadata`.
        - in: query
          name: sortingField
          schema:
            type: string
            enum:
              - local_timestamp
              - entity_timestamp
            default: local_timestamp
          description: Field used to order the deployments.
        - in: query
          name: sortingOrder
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
          description: Order of the deployments
        - in: query
          name: lastId
          schema:
            type: string
          description: Id of the last entity of the previous page, used together with `from` or `to` to paginate
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 0
          description: Number of deployments to skip. It can't be higher than 5000; use the `next` field of the pagination to go further.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
          description: Page size. Values out of range fall back to 500.
      responses:
        '200':
          description: A page of deployments
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/deployments'
              examples:
                default:
                  $ref: '#/components/examples/200-deployments'
        '400':
          description: Bad Request
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                entityType:
                  summary: EntityType not recognized
                  value:
                    error: Found an unrecognized entity type
                offset:
                  summary: Wrong offset value
                  value:
                    error: Offset can't be higher than 5000. Please use the 'next' property for pagination.
                tooManyFilters:
                  summary: Too many filter values
                  value:
                    error: Too many filter values; the maximum allowed per filter is 1000
                sortingField:
                  summary: Sorting field not recognized
                  value:
                    error: Found an unrecognized sort field param
        '429':
          description: Too many requests to this endpoint
  /content/entities/{entityType}:
    get:
      operationId: getEntitiesByType
      summary: List active entities by pointers or ids
      deprecated: true
      tags:
        - Content Server
      description: Returns the active entities with the specified ids or pointers. Exactly one of `id` or `pointer` must be set, with up to 1000 values. Denylisted entities are omitted. This endpoint is deprecated; use `POST /content/entities/active` instead.
      parameters:
        - in: path
          name: entityType
          required: true
          schema:
            type: string
            enum:
              - scene
              - profile
              - wearable
              - emote
              - store
              - outfits
            example: scene
          description: Type of the entities. It is validated but entities of any type are returned.
        - in: query
          name: pointer
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
              example: 0,0
          description: Pointer of the entities to return. Repeat the parameter to request several pointers.
        - in: query
          name: id
          schema:
            type: array
            maxItems: 1000
            items:
              type: string
              example: QmQ9UorFsVTpaVpCwJZAzFyCmaGf7Ksi6aQHYTJVKyzVMh
          description: Id of the entities to return. Repeat the parameter to request several ids.
        - in: query
          name: fields
          schema:
            type: string
            example: pointers,metadata
          description: Comma separated list of the fields to include, among `content`, `pointers` and `metadata`. All of them are included by default; omitted `content` and `pointers` are returned empty.
      responses:
        '200':
          description: List of entities corresponding to the matching ids or pointers
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=10
              description: Short cache window for the response
          content:
            application/json; charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/entity'
              examples:
                default:
                  $ref: '#/components/examples/200-entities-active'
        '400':
          description: Unrecognized entity type, or not exactly one of `id` or `pointer`, or too many values
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/error'
              examples:
                entityType:
                  summary: EntityType not recognized
                  value:
                    error: 'Unrecognized type: houses'
                filters:
                  summary: Missing or both filters
                  value:
                    error: ids or pointers must be present, but not both
                tooMany:
                  summary: Too many values
                  value:
                    error: Too many ids or pointers; the maximum allowed is 1000
